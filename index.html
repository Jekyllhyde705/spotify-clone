<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- Load Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Spotify Clone</title>
</head>
<body>
  <div class="container">
    
    <!-- Left Sidebar with Magic Navigation Bar -->
    <div class="sidebar">
       <div class="logo">
         <i class="fa-brands fa-spotify"></i>
         <span>Spotify</span>
       </div>

       <!-- MAGIC NAVIGATION MENU -->
       <div class="navigation">
         <ul>
           <li class="list active" id="nav-home">
             <a href="#">
               <span class="icon"><i class="fa-solid fa-house"></i></span>
               <span class="text">Home</span>
             </a>
           </li>
           <li class="list" id="nav-library">
             <a href="#">
               <span class="icon"><i class="fa-solid fa-book-open"></i></span>
               <span class="text">Library (<span id="liked-count">0</span>)</span>
             </a>
           </li>
           <li class="list" id="upload-trigger">
             <a href="#">
               <span class="icon" style="color: #1db954;"><i class="fa-solid fa-circle-plus"></i></span>
               <span class="text">Import</span>
             </a>
           </li>
           <!-- The sliding circular indicator -->
           <div class="indicator"></div>
         </ul>
       </div>
       <input type="file" id="audio-file-input" accept="audio/mp3" style="display: none;">
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
       <div class="top-bar">
          <!-- Search Bar -->
          <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" placeholder="What do you want to listen to?">
          </div>
       </div>

       <div class="header">
          <h2 id="section-title">Good Morning</h2>
       </div>
       
       <!-- Dynamic Cards Grid -->
       <div class="cards-grid" id="cards-container"></div>
    </div>

    <!-- Bottom Music Player Bar -->
    <div class="player">
       <!-- Left: Album art, details, and Like button -->
       <div class="player-details">
         <img src="" alt="Album Cover" id="cover">
         <div class="track-info">
           <h4 id="title">Loading...</h4>
           <p id="artist">Loading...</p>
         </div>
         <button id="like-btn" class="control-icon"><i class="fa-regular fa-heart"></i></button>
       </div>

       <!-- Center: Playback controls -->
       <div class="player-controls">
         <!-- Row 1: Buttons side-by-side -->
         <div class="control-buttons">
           <button id="shuffle" class="control-icon"><i class="fa-solid fa-shuffle"></i></button>
           <button id="prev" class="control-icon"><i class="fa-solid fa-backward-step"></i></button>
           <button id="play"><i class="fa-solid fa-play"></i></button>
           <button id="next" class="control-icon"><i class="fa-solid fa-forward-step"></i></button>
           <button id="repeat" class="control-icon"><i class="fa-solid fa-repeat"></i></button>
         </div>
         <!-- Row 2: Progress bar -->
         <div class="progress-container">
           <span id="current-time">0:00</span>
           <input type="range" id="progress" value="0">
           <span id="total-time">0:00</span>
         </div>
       </div>

       <!-- Right Side: Volume & Audio Device Switcher -->
<div class="player-right-controls">
  <!-- Bluetooth / Output Device Switcher Button -->
  <button id="speaker-select-btn" class="control-icon" title="Switch Audio Output (Bluetooth/Speakers)">
    <i class="fa-solid fa-headphones"></i>
  </button>
  
  <i class="fa-solid fa-volume-high"></i>
  <input type="range" id="volume" value="80">
</div>

  </div>
  <script src="script.js"></script>
</body>
</html>
